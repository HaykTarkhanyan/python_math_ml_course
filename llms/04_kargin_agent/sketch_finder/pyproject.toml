[project]
name = "sketch-finder"
version = "0.1.0"
description = "An agent that finds Kargin Haghordum sketches with SQL, regex and web search; an eval and an MCP server."
readme = "README.md"
requires-python = ">=3.11"   # a range on purpose: the code needs 3.11+, and any newer Python should do
dependencies = [
    "mcp==2.3.0",
    "openai==2.6.1",
    "python-dotenv==1.1.1",
    "tavily-python==0.8.5",
]

[project.scripts]
sketch-finder = "sketch_finder.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0"]
maintainer = ["pandas==2.3.2"]   # only scripts/build_questions.py: uv run --group maintainer ...

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
