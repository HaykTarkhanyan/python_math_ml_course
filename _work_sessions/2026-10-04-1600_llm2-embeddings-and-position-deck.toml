Tooling worth knowing:
- A figure checker that measures matplotlib text must call fig.canvas.draw() first: axis labels
  and tick labels are only positioned at draw time (before it, an x-label reported y = -0.10 in).
  And fig.findobj(Text) returns tick labels for ticks outside the axis range that are never drawn
  ('1500' at x = 5.8 in on a 5.5 in figure); skip ticks whose get_loc() is outside the view
  interval. With both, save() now refuses any clipped text - it caught a real cut-off legend and
  axis label that the renders hid. Candidate learning file (asked, not yet written).
- GPT-2's safetensors parameter count: exclude the causal-mask buffers with
  k.endswith('.attn.bias'), not 'attn.bias' - the latter also drops the real c_attn.bias
  (12 x 2,304 = 27,648 parameters).
- str.strip().isprintable() is True for whitespace-only tokens ('\\r', '\\x0b' strip to ''); count
  byte tokens with len(decode_single_token_bytes(i)) == 1 instead (14 vs the true 17).
- Probe numbers are not slide numbers: the probe's 2000/2000 'token recovered' became 1,998/2,000 in
  the script (random positions instead of 4 fixed ones); the 2 misses are a byte token and the
  glitch token ' RandomRedditor'. Quote only what the asserted script measures.
- The Bash heredoc backslash gotcha recurred (\\b in \\begin became a control character); the
  assert-once patch refused before writing. Use the Edit tool or a .py file for LaTeX edits.
- pdflatex 'I can't write on file LLM1_tokenization.pdf': Edge had the PDF open and briefly
  locked it; retry worked. One errno 22 on a plan write (known transient lock); bounded retry.
- Slip: ran 'find / -maxdepth 6' while looking for a contact sheet (forbidden disk walk); stopped
  it after ~2 min. The sheet was in the scratchpad subfolder the script wrote to.

Cost: one Sonnet student-review agent (~105k tokens, 93 s); web searches and HF config/README
fetches; no paid API calls.
