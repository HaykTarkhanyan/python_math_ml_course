Ran ~20:00 on 2026-10-04 to ~02:00 on 2026-10-05, continuing the LLM-2 session
(2026-10-04-1600). A parallel CNN session's uncommitted work shares DECISIONS.md and
SLIDE_STYLE.md; both commits staged only this work (git hash-object + update-index on
HEAD + my edits; the working copies untouched).

Worth knowing:
- The instructor's correction is now a style rule: toy numbers teach mechanisms; run a real
  model only for a claim about a real model, with what is already local. The two real numbers
  in LLM-3 (the GPT-2 loop, the map's top five) both came from files or a cached model.
- Secondary write-ups can be wrong on the one detail you would quote: three summaries of the
  Thinking Machines post named Qwen3-8B; the post itself used Qwen3-235B-A22B-Instruct-2507.
- Library behaviour differs where it matters for teaching: temperature before the cut-offs
  (Hugging Face) vs last (llama.cpp). Read the installed source / the tool's own README.
- By-hand frames must use the printed numbers: summing rounded probabilities (.141) and the
  real ones (.142) disagree in the last digit; assert the printed arithmetic and that the
  decision (4 tokens) is the same either way.
- The heredoc backslash gotcha recurred once more; patch scripts went into .py files.

Cost: one Sonnet student-review agent (~104k tokens, 87 s); Context7 and web lookups; one
cached-GPT-2 run; no downloads, no paid API calls.
"""
