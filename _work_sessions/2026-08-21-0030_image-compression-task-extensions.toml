notes = """
THE STRONGEST EXTENSION WAS THE ONE THAT INDICTS THE EXISTING SOLUTION. Rather than "here is
another colour space to try", the gamma section proves the palette the students just built is
systematically biased dark, and the bias is one-directional by Jensen's inequality (the sRGB
curve is convex, so f(mean) <= mean(f) - the quantized image can only lose light, never gain it).
Clustering in linear light preserves each cluster's total light EXACTLY, by the definition of the
mean, for any k and any image. That is a provable guarantee rather than an empirical improvement,
which makes it a much better exercise than a comparison.

A GOOD SIDE-CATCH: the linear route measured -0.03% rather than a clean 0.00%, which looked like
the theory failing. It was sklearn's `tol` - KMeans stops when centroids move less than the
tolerance and returns centroids from one iteration before the final assignment. Recomputing them
as exact means of the final labels gives +0.0000%. Kept in the notebook as a worked aside, because
"the maths is exact, the library is approximate" is a lesson worth more than the number itself.

HARDCODED A PROTOTYPE NUMBER INTO PROSE AND ALMOST SHIPPED IT. The markdown said DBSCAN goes
"from 17 colours to 1"; 17 came from the prototype's subsample, while the notebook's own run gives
14. Caught by diffing the executed outputs against the prose. Any narrative number in a notebook
must be read back OUT of the executed cell, not carried over from the exploration that motivated
it. The k-medoids section avoided this by referring to "that percentage" rather than quoting one.

sklearn_extra is NOT installed, so k-medoids is hand-rolled (alternating assign / replace-medoid,
with candidates and cost references both subsampled to keep it O(n) per iteration).
"""
