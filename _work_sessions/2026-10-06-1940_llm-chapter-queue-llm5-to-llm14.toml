notes = """
Ran from about 19:40 to about 22:35 on 2026-10-06. One instruction ("do all queue items") after
four answered questions; no other user input. Subagents: one Sonnet student review per deck
(approved); no paid API; no downloads; no pushes.

Worth knowing:
- Measure, then claim. Four times the measurement contradicted the draft: GPT-2 showed the
  reverse of the published recency bias (LLM-10); Hoffmann's published fit disagrees with its
  own 20-tokens rule (LLM-8); Kalai et al.'s text says "penalty 2" where its formula gives 3
  (LLM-11); and a 1,265 s LoRA run was really ~4 minutes plus a 17-minute machine stall.
- The student reviews kept catching real errors the detectors cannot: an impossible toy (40
  byte-level tokens for 45 Armenian characters), Wx vs xW in the LoRA formula, -ln 0.18 printed
  as 1.70, an unexplained 8-bit-loses-to-4-bit result, GiB compared with GB on one line (LLM-14).
- Two silent bugs, now learnings: matplotlib's CreationDate dirties every redraw (27 date-only
  files left out of a commit), and NumPy 1.26's int32 default on Windows drew a 16 GiB bar as 0.
- Git Bash heredocs mangled backslashes four more times today; the Edit tool or a Write-tool
  patch file is the safe path for anything with a backslash.
- Several queue/plan edits for two decks sat in one file at once; staging "index + this deck's
  edits" through git hash-object kept one commit per deck.

Cost: no downloads; about 40 short local model runs on the cached GPT-2 (the longest the
few-shot measurement, 450 s, and the LoRA demo); eleven Sonnet student reviews, about 880k
tokens together.
"""
