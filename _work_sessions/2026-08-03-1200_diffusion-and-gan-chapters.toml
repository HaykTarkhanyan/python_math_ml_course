notes = """
THE MISTAKE WORTH REMEMBERING: I wrote the diffusion plan's cross-reference table from memory
instead of opening the decks. An adversarial reviewer checked it and 6 of 8 callbacks were
fiction - Jensen's inequality, the L13b cosine-similarity callback, L19's GAN-instability
frame, and cross-attention in L24/L25 were all absent, and L23 had already given away the
latent-diffusion reveal I planned as a surprise. Every row now cites file:line. This is the
same failure mode as writing numbers from memory: the table read as authoritative precisely
because it was specific.

MEASURED, NOT ASSERTED:
- The 2D spiral samplers were undertrained at T=200 with a cosine schedule, which is why DDIM
  produced escapees. Fixed with T=1000 linear + cosine LR decay: loss 0.298 -> 0.158, and the
  DDIM-25 spread came out 0.642 against DDPM's 0.682.
- At T=400 the forward process never actually reached noise: sqrt(abar_T) = 0.132. T=1000 gives
  0.0064. The check is now a hard RuntimeError in digits_ddpm.py rather than a printed warning.
- Classifier-free guidance did NOT behave the way the slide first claimed. I wrote that samples
  scatter and then tighten; the measurement showed alpha=1 already works and alpha=7.5 overshoots
  the data manifold (radius 1.10 against a data max of 1.0). Rewrote the slide and the figure
  title to match the measurement instead of tuning until the story came true.

TWO DELIBERATE REFUSALS TO FABRICATE. The schedule-mismatch failure panel was supposed to show
broken digits and produced clean ones. The GAN run was supposed to mode-collapse and only got to
TV=0.079. In both cases I kept the honest result and made it the lesson. The GAN honesty slide -
which states outright that this run did not catastrophically collapse - was the thing I most
wanted an outside read on, and the student reviewer called it good scientific communication.

PROCESS NOTES:
- Page-number collisions appeared THREE times, and every one was introduced by a fix and caught
  only on re-render. Re-render after every edit, without exception.
- The GAN student review caught the exact fault that the L23b/L23c placement created: L23c told
  students they had 'seen this exact structure before - twice', citing L30, which is five
  lectures in their future. Moving GANs earlier in the thread silently turned a back-reference
  into a false claim about the past. Split into 'you have seen this in L21' and 'you will meet
  it again in L30'.
- Enlarging the FID figure to fix an unreadability complaint immediately caused an overflow that
  clipped two of its four panels. The reviewer had also misdiagnosed that figure (it claimed only
  two panels were labelled; all four were, just too small to read) - a reminder that a reviewer
  can be right that something is wrong and wrong about why.
- yt-dlp needed --js-runtimes node; my first theory (rate limiting, from a real 429 on translated
  subs) was wrong and is recorded as disproven in _learnings/.
"""
