notes = """
Deck angle: deck 15 already derives FlashAttention, so 19 deliberately does NOT
re-derive it - it treats FlashAttention as one rung and spends its frames on why
no compiler can discover it (needs an algorithmic rewrite, the online-softmax
trick from Milakov & Gimelshein 2018). That is what keeps 19 complementary
rather than duplicative.

The three predict-first frames are the reason this is a lecture and not a cheat
sheet, and all three are places where the obvious cost model gives the wrong
answer: TF32's datasheet 8x delivers 3x (memory-bound); FlashAttention does MORE
FLOPs and wins by 27%; padding vocab 50257 -> 50304 adds compute and is 4%
faster (~30% on PyTorch <= 2.3.1).

Tooling: hit the Bash-heredoc backslash-mangling bug twice while patching the
figure script and the .tex - wrote it up in _learnings. Switched to the Edit tool
and it went away. Also worth remembering that `grep -c` returning 0 exits 1 and
will break a && chain.
"""
