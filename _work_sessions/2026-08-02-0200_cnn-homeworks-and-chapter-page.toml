notes = """
Only 5c3b5ef is this session's work. The other three commits were pre-existing uncommitted
work found in the tree when the instructor asked for a clean tree; grouped by what the diffs
and ml/00_plan.md actually say, but not authored here.

MEASURED FACTS WORTH KEEPING (all computed in cells, none asserted from memory):

1. The convolution cost story inverts at large k, and this overturned the plan.
   At k=3..19 the tap loop (vectorised over the image) beats the pixel loop by ~100x.
   At k=181 they are level: measured 0.99x. The tap loop sweeps the whole padded image once
   per tap - 32,761 passes over several MB - so it goes memory-bound, while the pixel loop
   reuses a small cached window. Separability measured 100x, slightly BEATING the 90x its tap
   count predicts. Lesson written into the notebook: vectorising is a constant-factor trick
   that stops paying as the problem grows; only the algorithmic change survives.

2. Cache broke the cost model three separate times. A two-parameter fit
   (t/px = a + b*taps) fit its own training points well and still mispredicted the k=181 job
   by 2.8x, because per-tap cost depends on how much of the image stays resident. Final
   approach: run all three implementations for real at reduced resolution and trust only the
   RATIOS between implementations measured at the same size.

3. H&E stain separation is much tighter than "purple vs pink" suggests.
   Every stained pixel in the cirrhosis slide sits in 277-320 degrees of hue (p1=277, p50=309,
   p99=320). The plan's band of 0.72-0.92 covers essentially all of it and flags 24% of the
   field. The real structure is a haematoxylin shoulder at 275-295 against an eosin peak at
   305-320, valley near 300. Cutting at 295 with V < 0.78 gives 4.8% and 90 components.

4. The nuclei count stands on a cliff. Nudging V by -0.04 moves the count -67%; +/-5 degrees
   of hue moves it 6-16%. This became the point of HW1c task 4: the mechanics are identical to
   [08] hyperparameter tuning, but with no validation set and nothing labelled there is no
   score to maximise - only plausibility argued from outside the image.

PROCESS NOTES:

- Built the SOLUTION notebooks first, deliberately. A task notebook full of blanks cannot be
  executed, so it cannot be verified, and every number in the prose had to come from a real
  run. Task versions are then derived mechanically, so the two cannot drift.
- The deriver RAISES if a named function or block is not found. The silent failure mode here
  is shipping a task notebook that still contains the answers, and a student would never
  report it.
- Beamer silently clipped the new HSV frame on the first attempt - the figure's bottom row and
  the entire callout box were missing, with 0 errors and 0 overfull warnings in the log.
  Caught only by rendering page 8 to PNG and looking. Fixed by dropping the figure's suptitle.
- Two figure bugs caught the same way, both of which would have taught the opposite of the
  intended lesson: uncomputed cells in the walkthrough grid printed '0' (indistinguishable
  from a real zero result), and an autoscaled |difference| panel turned 1e-16 rounding noise
  into a vivid pattern, making two provably identical arrays look different.
- Instructor direction mid-session, now standing for this chapter: "the goal is clear demo and
  understanding, not compact notebooks." This overrode the plan's original "under 2 minutes end
  to end" target and drove the split into two notebooks plus the expanded step-by-step demos.
- A content review of the finished solution notebook found 8 defects including a hollow
