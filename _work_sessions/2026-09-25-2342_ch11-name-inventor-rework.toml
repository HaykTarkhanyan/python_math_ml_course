notes = """
Machine-load incident: the first pilot ran torch with its default 4 threads and pinned the
CPU at 100% for minutes (100-epoch trainings took 60-110 s); it was stopped. Single-threaded
the same work is 5-10x faster under background load and 2x faster on an idle machine
(66 vs 130 ms/epoch) - tiny matmuls lose more to thread coordination than they gain.

The first notebook execution failed at the wandb account-check cell: wandb-core did not write
its port file within 30 s ("Failed to read port info after 30.0 seconds"), raised as an
AuthenticationError. Standalone the same call took 6.8 s and the retry succeeded - a one-off
slow service start (probably Defender scanning the binary). If it happens in class, rerun the cell.

wandb.Settings(quiet=True) did not suppress the "uploading artifact ..." lines on finish, and
run.finish(quiet=True) is deprecated in 0.28.2. Settings(silent=True) plus a plain finish()
gives clean cells; the notebook prints run.url itself.

UMAP cost: pilot first import 150 s + first fit 78 s on 39 points (numba compile); notebook
cell 125-166 s. Plotly under nbconvert here defaults to the plotly_mimetype renderer (VS Code
detected), ~10-40 KB of JSON per figure, no embedded plotly.js - no notebook bloat.

Build method: notebook written from a delimited source file in the session scratchpad
(build_nb.py build/sync); sync mode copies comment-only source edits into the executed
notebook and refuses any executable change. Seeds + one thread made two full executions print
identical numbers.
"""
