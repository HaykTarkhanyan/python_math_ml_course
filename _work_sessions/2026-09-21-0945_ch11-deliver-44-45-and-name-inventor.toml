notes = """
A credential guard can break the no-credential fallback sitting next to it. The entity print
was added after runs once went to a stranger's account, and it is the right check - but it
made WANDB_MODE=offline unreachable, which was the documented escape hatch for students with
no account. Fix was a branch, not a try/except: wrapping it would have silently restored the
original bug (runs going somewhere you did not choose). Worth a _learnings/ entry.

Editing an executed .ipynb by hand: json.dumps(nb, indent=1, ensure_ascii=False) + '\\n',
written in text mode on Windows, reproduces Jupyter's on-disk format byte for byte here.
Proving the no-op round trip first (149002 == 149002 bytes) is what makes a targeted source
edit safe without nbformat rewriting the whole file. Each edit asserted exactly one match
before replacing.

Python printing Armenian to the Git Bash console dies with UnicodeEncodeError (cp1252);
PYTHONIOENCODING=utf-8 in front of the command is the fix, needed for every notebook dump.

Verified rather than assumed for the handout: 689 names, 660 ending in -յան, 38 distinct
characters, and the only Armenian letter absent from the corpus is ը. Also checked that the
five invented surnames quoted as examples are genuinely absent from the training data, since
the text presents them as names that do not exist.

The instructor deleted L14/L15 and the finished planning docs in the working tree between
turns; this session only recorded that deletion. The blobs stay in history, so the decks are
recoverable with git log --diff-filter=D.
"""
