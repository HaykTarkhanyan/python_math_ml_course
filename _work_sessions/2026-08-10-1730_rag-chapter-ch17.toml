notes = """
FIVE PLANNED CLAIMS DIED ON CONTACT WITH MEASUREMENT. Recorded because the pattern matters
more than any one of them:

1. "Dense retrieval is worse at exact identifiers." Measured over five competing part
   numbers: BM25 4/5, dense 4/5. Identical. Cut. Replaced with an argument from guarantees
   (BM25's score is nonzero iff a query term literally appears), which follows from the
   scoring function and does not depend on corpus size.
2. "Hybrid beats both halves." Measured over 16 queries: dense MRR 0.922, RRF 0.913, BM25
   0.837. Fusion lost to dense alone and made the paraphrase query worse, rank 4 -> 9.
   Kept as a taught negative result. l42_retrieval_figs.py now RAISES if hybrid ever beats
   both, so the negative cannot silently rot.
3. "Each method wins different queries." They agree on 15 of 16.
4. "Keyword extraction improves retrieval." RAKE and YAKE both failed to move the answer's
   rank; only KeyBERT reached rank 1.
5. L43's intended cold open. The fault chunk ranked 7th and would never have reached a
   top-5 prompt, so the cold open was rebuilt around two contradictory revisions at ranks
   1 and 2 - a stronger lesson, since the answer is faithful and still wrong.

WHAT THE AUTOMATED CHECKS CANNOT DO. The margin scanner, the acronym grep and pdflatex all
passed a slide whose 2x2 taught the opposite of the truth. Only a reader evaluating meaning
caught it. Written up in _learnings/2026-08-10-2210.

THE NARROW-BAND THROUGH-LINE, found by accident. Cosine similarities always cluster in a
narrow band, and the chapter hits this three separate times: semantic chunking's entire
signal is 0.06 wide (0.819-0.876), a generic multilingual model separates the right Armenian
passage from an unrelated one by only 0.057, and InfoNCE at tau=1 gives probabilities
0.350/0.331/0.320 despite similarities of 0.834 vs 0.745. Temperature is the knob that turns
that band into a decision. The deck now names it once and calls back twice. Nobody planned
this; it fell out of the worked example added in response to the pedagogy review.

MACHINE NOTES. sentence-transformers and torch 2.9.0+cpu were already in the ma venv.
USE_TF=0 is REQUIRED for any script importing sentence_transformers - TensorFlow is present
and transformers refuses to import its TF integration under Keras 3. Model used throughout is
intfloat/multilingual-e5-small (already cached). ATE-2-large was NOT in the HF cache despite
expectation - what is cached is ATE-1, tokenizer files only, no weights.
"""
