notes = """
Ran across two days (2026-10-02 21:26 to 2026-10-04 ~01:00), alongside a parallel session working on
ml/12_cnn - its uncommitted files (renamed CNN decks 48_/50_-52_, liver biopsy practical, DECISIONS
#60/#61) are not this session's.

Tooling, so the next session does not repeat it:
- Bash heredocs mangled backslashes twice (a \\b became a backspace; a \\n collapsed). Both times an
  assert/one-match check stopped the script before it wrote anything. Probe scripts go in .py files
  via the Write tool.
- OSError errno 22 on writes hit 6 times, always on files pdflatex/pdftoppm had just read, during
  back-to-back writes; a 1 s retry loop clears it after ~4 s. forward_pass_anim.py now retries.
- gradient_flow.py's main() deliberately never regenerates L20's figure (July rule); the new
  --l20-figures flag is the only way, and it checks the data first.
- detect_small_figure_text.py ignores single-character spans, so one-digit log-axis exponents
  pass it while being ~5 pt; log-axis tick labels are now 8.5 pt in all three log plots.
- Slips: one rm with a wildcard next to a variable (scratchpad PNGs only; afterwards renders went
  to fresh folders) and one 92 s script run in the foreground instead of the background.
