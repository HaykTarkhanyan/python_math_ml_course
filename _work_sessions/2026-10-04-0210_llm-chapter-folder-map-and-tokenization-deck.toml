notes = """
Ran 02:10-03:45 and 14:30-15:50 on 2026-10-04, continuing the 2026-10-02-2126 session after a
context compaction, alongside a parallel CNN session whose uncommitted work shares DECISIONS.md,
SLIDE_STYLE.md and WORKFLOWS.md.

Tooling worth knowing:
- Partial staging without git add -p (not available here): build the staged version as HEAD +
  only this session's edits in a Python script, then git hash-object -w --path=FILE and
  git update-index --cacheinfo. Used for all four commits; the other session's hunks stayed
  unstaged and its working copy was never touched.
- Beamer reads a brace group placed right after the frame title, like a small-font intro
  paragraph, as the frame SUBTITLE (it rendered in blue under the title on six frames).
  Fix: a vskip before the group.
- Figure layout: measure label widths with the renderer instead of guessing ('Embedding' is
  0.63 in at 8 pt); a chip-row helper that raises on overflow caught every too-wide row.
- Map redraw took 19-78 s and the attention decks take 1-3 min each to compile on this machine:
  run both in the background.
- Python caches one-byte bytes objects, so 'part is a' identity checks misfire when two merged
  bytes are equal; compare by index.
- The first figure-script probe left the gloss's final period off and counted 19 vs 16 on o200k;
  the locked gloss ends with 'me.', so it is 19 vs 17.

Cost: one Sonnet student-review agent (~100k tokens, 90 s). No paid API calls.
"""
