notes = '''
Build reliability (the expensive lesson). Beamer takes \inserttotalframenumber from the .nav and
defaults it to 1 when there is none; clean_latex.py deletes .nav, so every build starts cold and
needs TWO SUCCESSFUL passes. A pass that fails to write the PDF ("I can't write on file X.pdf",
exit 1) does not count, yet pdfinfo page counts, grep -c '^!' on a later log, and the last exit
code all happily report success from the stale PDF. A footer reading N/1 is a build failure, not
a source bug. Likely lock trigger: running pdftotext/pdftoppm/pdfinfo on the PDF immediately
before the next pdflatex pass (Windows handle). Reliable loop: per pass, record exit code and
stat -c %Y of the PDF before/after; only render or read the PDFs after all passes are done.
Beware cut -d. on "file.pdf -> timestamp" - it truncates at the filename's dot.

Detectors on the embed set: detect_footer_collisions.py flagged 37/48 pages of dl_regularization,
all of them LMU includepdf pages (LMU's own footer sits in our page-number band); filter flags to
our own frame numbers. detect_clipped_slides.py false positives on dl_intro_history frames 9 and
19 come from warnred (missing from JUNK) and the accented Th\'e\^atre D'op\'era; both verified
clean by rendering.

Double descent at teaching scale: a trained MLP (Adam + cross-entropy) did not show the peak;
Belkin's random-features + minimum-norm least squares shows it instantly and exactly at
n_features = n_train, but only with a grid dense around n_train. The second descent (13.7%) does
not beat the classical minimum (11.6%) - say so on the slide.

Guo et al. Figure 1 crop: page 1 of arXiv 1706.04599, clip Rect(296, y0('LeNet (1998)') - 6,
548, y0('Figure 1.') - 3), written as vector with PyMuPDF show_pdf_page; one-off script in the
session scratchpad, deliberately not a py_src file (instructor: no new py_src for these).

Welch Labs stills: f25 (17:20) is mid camera pan and f41 (27:40) does not clearly show dead
neurons - rejected. Settled picks: 17:15 (step 319, good run), f26 17:50 (step 11), f27 18:20
(step 299, stuck). 4:3 decks letterbox a 16:9 still with 1.2 cm black bars top and bottom; the
caption goes in the top bar so it never collides with the bottom-left attribution.

Grep pitfalls this session: `grep -E '\bL1[45]\b'` over *.qmd skipped neural_networks.qmd
(non-ASCII content) although it links both PDFs - confirmed by reading the file. The
DEFERRED_TODO.md em dashes (32) are pre-existing in git HEAD; the section added here has none.

Instructor preferences stated this session: does not use pause reveals ("I usually just open the
full frame"); minimal new py_src for non-crucial additions; GELU explained in ch5 after all but
handing off to ch9.

Other reference material found: misc/grokking/ holds a built grokking + mech-interp deck
(39 KB tex), reproduction code and both papers - candidate teaser tied to AdamW weight decay.

Beamer subtitle trap: \begin{frame}{Title} followed (even after a newline) by {\small ...} takes
that brace group as the frame SUBTITLE. It compiles clean, detect_clipped_slides finds every
word, nothing clips - the paragraph just renders in title-blue pushed up under the title. Start
the body with a bare \small (or any non-brace token) instead. Only a rendered page reveals it.
'''
