notes = """
Three things worth carrying forward.

1. Beamer clipping is real and it bit us. L34's recap frame silently lost the tail of its last
list item - the final slide of the chapter - with zero Overfull vbox warnings, a correct page
count, and after a self-review had already passed the deck. Found by an opt-in Sonnet student
review reading the rendered PNGs. The detector now in non_essential/ was written in response,
validated against that known-broken commit, and got two premises wrong before it worked: it
first flagged 44 of 48 frames (the literal word 'frame' leaking from \\end{frame}), then assumed
clipping always drops a frame's tail, which is false - in a two-column frame the left column can
clip while the right renders fine.

2. Reviewing sources beats reviewing summaries. Three separate errors this session came from
characterising a file by its title instead of opening it: the tabular chapter's thesis was aimed
at the hyperparameter-tuning deck, which never makes the claim being attacked (ch04 does); a
frame 'defended' ch06 against an accusation ch06 had already made itself, with numbers; and the
TabPFN complexity was written as quadratic in the cell count when the paper says O(n^2 + m^2) -
the factorisation is precisely what avoids the cell-count blowup.

3. A lecture whose thesis is a number has a shelf life. L37 was built around 'wins up to 10,000
rows' from the Nature paper, and TabPFN-3 now claims 1,000,000 - a 100x move in eighteen months.
The recap no longer states a threshold at all; it tells students to look up the current one, and
the deck teaches that the two figures are not equal evidence (peer review vs vendor benchmark).
"""
