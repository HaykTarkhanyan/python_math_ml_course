notes = """
Fingerprint of an in-class annotated PDF in this repo: the producer string is untouched
(pdfTeX, or PyPDF2 for the LMU splits), but ModDate is minutes to days after CreationDate,
there is an extra %%EOF (incremental save), and pages carry /Ink annotations. A fresh
pdflatex build has ModDate == CreationDate, one %%EOF, 0 Ink. File size alone is not
reliable: 01 notes is only 4% bigger than clean (24 strokes on 1 page).

pdfpages (includepdf) drops the source PDF's annotations, so the inked slides_lmu files never
leaked ink into the recompiled decks (the Oct 29 04_first_order.pdf already had 3162 strokes
and the 03 deck built from it had 0). Stripping the LMU files leaves their page content
byte-identical, so the decks that include them compile to the same output as before.

Some LMU ink predates this term: 04_first_order.pdf already had 3162 strokes on Oct 29 2025,
before the GD lecture. Its notes file therefore mixes more than one course run.

Repo size: the _notes files reuse the existing blobs (pure renames); the new clean PDFs add
about 71 MB of new blobs (04_first_order clean alone is 39.4 MB - mostly images).

Backlog-commit method: per group, git add explicit paths, then refuse to commit if anything
outside the group's path prefix is staged (the grep -v of the prefix must come back empty).

Oddity, cause not investigated: Python subprocess.run(["git", "show", "HEAD:<5.6 MB notebook>"],
capture_output=True) died with MemoryError in the pipe-reader thread and left git hanging;
the same git show redirected to a file from Bash was instant. Dump blobs from Bash instead.

nbconvert on Windows printed a libzmq "Assertion failed: Connection reset by peer [10054]" at
kernel shutdown - harmless: the notebook was written and the exit code was 0.

Tools were one-off scratch scripts in the job tmp dir (scan_annots.py, render_check.py,
strip_ink.py, nb_change2.py), not added to the repo.

Skipped compile-deck step 6 (open in Edge for review): optim deck content is an
unchanged-source reproduction, nothing new to review. clean_latex.py run scoped to
math/Lectures/optim: no junk found.

Leftovers seen, not touched: 06_evolutionary.tex was never compiled and its page range
{2-4, 9} is copy-pasted from 05; 04_momentum_adam.tex is just two URLs, not LaTeX;
ml/math_index/README.md:29 calls the stat _notes PDFs "speaker notes baked in" (they are hand ink).
