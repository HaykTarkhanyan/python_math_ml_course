notes = '''
Fact-checks done against primary text where it mattered: He et al. 2015 Sec 4.1 (degradation
"unlikely to be caused by vanishing gradients"), AlexNet Sec 3.2/3.5 (which conv layers were
per-GPU), YOLO v1 Sec 2 (448 px, cell-relative x/y, image-relative w/h, class-specific score,
"responsible" predictor), Pascanu et al. 2013 Sec 2.1 (they state it in EIGENVALUES - I first
wrote "singular value" and corrected it), Vaswani et al. 2017 intro quote, Meta's DINOv3 blog,
keras.io unit_forget_bias, Ultralytics YOLO26 docs. PyTorch BN momentum and the 1-0.9^10 drift
were measured, not recalled.

Measure-first paid off twice in the practical: (1) T=30 was going to be the race distance -
the sweep showed a vanilla RNN solves T=20 in 200-500 steps and T=40 only sometimes, so the
race moved to T=40 where the split is clean; (2) I wrote "for letters 1-4 the two losses match"
before bucketing correctly - the measured gap there was 0.052, i.e. model, not memory. The
prose now says exactly that and turns "why letters 7-8?" into a discussion question.

The July "no LSTM advantage" null result had a real cause (PyTorch's half-shut forget gate) -
see the new _learnings file. That is now the lesson, not an embarrassment on the slide.

Tooling traps hit this session: (a) the Bash-tool heredoc backslash trap (already documented in
_learnings/2026-09-08-2105) broke one builder edit and silently no-oped several sed edits - I
switched to the Edit tool / JSON patch files; (b) "I can't write on file X.pdf" locks after
pdftoppm/detector reads - scratchpad build.sh now retries up to 4x and still insists every pass
rewrites the PDF; (c) \\item [42] swallowed the bracket (new _learnings file); (d) pdflatex has
no Armenian glyphs, so slide text uses "-yan" not the Armenian letters.

A parallel Claude session committed ch19 work on main during this session (d693503..19c288a)
in the same working tree; this session staged strictly by path and ran clean_latex.py only on
ml/ch6_cnn and ml/ch7_rnn (skipped the repo-wide clean on purpose). Pre-existing unrelated
modifications left unstaged: .claude/skills/youtube-reference/*, ml/11_neural_networks/
