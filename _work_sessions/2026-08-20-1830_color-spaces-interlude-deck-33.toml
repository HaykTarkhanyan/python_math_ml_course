I ALMOST SHIPPED A WEAKER CLAIM THAN THE DATA SUPPORTS, IN THE OTHER DIRECTION.
The standard telling of Lab is "equal RGB steps look perceptually unequal". Measured it: a single
equal step near black vs near white only moves delta-E from 10.6 to 13.4, because Lab's cube-root
L* partly cancels sRGB's gamma. The honest and stronger claim is about the SPREAD across the whole
cube (3.7x at fixed RGB distance), so the frame says that instead. Recorded in DECISIONS #24.

