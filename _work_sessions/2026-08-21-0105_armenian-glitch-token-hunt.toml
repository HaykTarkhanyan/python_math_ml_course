notes = """
THREE BUGS, ALL CAUGHT BY VERIFYING RATHER THAN TRUSTING GREEN:
1. `python -m jupyter nbconvert` from the ma venv silently ran the SYSTEM Python's broken
   nbconvert (PATH dispatch), and `| tail` ate the nonzero exit code - the "successful" smoke run
   had produced nothing. Rule: `python -m nbconvert`, never through a pipe. (learning 0135)
2. Byte-level BPE merge halves are individually invalid UTF-8; decoding parts separately made
   Qwen's Armenian merges invisible ("no Armenian at all" while the census counted 79 tokens).
   Concatenate bytes first, decode once. Fixed rank: 144,669. (learning 0140)
3. Full run #1 died with `memory allocation of 5120000 bytes failed` (kernel OOM) because the
   Gradio app was loading all 8 tokenizers for a Playwright test WHILE the notebook tokenized
   20M chars - two tokenizer-heavy processes on the 16 GB machine. Reran strictly sequentially
   with count_ids only for XLM-R, del word_freq, and del of the 768 MB embedding matrix before
   the MLM model loads. Second run finished in ~5 min on warm caches.

The efficiency story in one line: writing Armenian through GPT-4's tokenizer cost 8.8x more
tokens per character than English; GPT-4o cut that to 1.6x - and you can see the investment
directly in the merge table (o200k learns ա at rank 619; Llama 3 not until rank 263,556).
