notes = """
Shared-index incident: a parallel Claude session working on ch11 committed while this session's
`git mv ml/ch6_cnn ml/12_cnn` was staged, so the 192-file rename landed in its commit 0da6e45
('name inventor [47] review fixes') and this session's _quarto.yml edit in cbe4828. History was not
rewritten (already pushed). Lesson for next time: commit a git mv immediately, or stage nothing
until commit time, when another session may commit in the same working tree.

Tooling traps hit this session, each with its fix:
- torch.export with Dim.DYNAMIC refuses an example batch of 1 (0/1 specialization); an example
  batch of 2 exports a model that runs at batch 1, 7 and 500.
- numpy 1.x on Windows makes np.array([ints]) int32; F.cross_entropy wants int64. augment() upcast
  the labels silently, so the bug only showed when training without augmentation.
- The 'ma' Jupyter kernel took ~100 s to start on 2026-10-01 (it was fast earlier); nbclient's
  default startup_timeout (60 s) killed the run with an unhelpful cleanup AssertionError. The builder
  now passes startup_timeout=300.
- HF datasets-server: /filter timed out at 90 s on a 150k-row set; /rows answers in ~1 s but returns
  429 after ~10 quick calls. Rows of that set are label-sorted, so offsets can be estimated.
- Plotly 6 stores trace data as base64 'bdata' in notebook JSON - decode before reading numbers.
- A fake dataset built from real photos proved the notebook RAN but hid that the CNN learned
  nothing; only a known-answer synthetic set exposed it.
The last five are written up as _learnings/2026-10-01-0044_* (instructor asked for them).
"""
