requested by the instructor. No paid API, no model downloads (T5/BERT/Qwen tokenizer files only,
a few MB).

Worth knowing:
- The research agents corrected several premises: OpenAI does publish tokenizers; LLaDA is
  "competitive with", not better than, LLaMA 3 8B; Gemini Diffusion never shipped; the ROME
  Eiffel example is on the project page, not in the paper; "all eight left Google" needs
  Shazeer's 2024 return. Slides say the corrected versions.
- Reviews found errors in frames written the same day (LLM-5's diffusion frame lacked its point;
  LLM-1's SentencePiece frame was wrong about spaces). A same-day review is worth its tokens.
- Repo hygiene: another session had 16 ch19 renames staged and 5 decision entries uncommitted.
  Each commit was built from a constructed index (git hash-object + update-index for a partial
  DECISIONS.md; renames unstaged and restored with cacheinfo to HEAD's blobs), so none of that
  work was swept into these commits or changed in the index.
- Git Bash heredocs mangled backslashes again (a sed and a heredoc Python edit silently failed or
  aborted); script files written with the Write tool were reliable.
