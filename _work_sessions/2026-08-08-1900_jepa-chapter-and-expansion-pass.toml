notes = """
Five things worth carrying forward. Three are mistakes.

1. A learning that is not applied is just a diary entry. The youtube-reference download step
has been broken since 2026-08-03 and a _learnings file described the cause and the exact fix
(yt-dlp needs --js-runtimes node; deno is the only default and is not installed here). The
script was never changed. The failure mode is what made it survive: metadata, description and
subtitles all download normally, so the folder looks healthy and only video.mp4 is missing. The
script now asserts the mp4 exists and exits 1 if not, so it can never fail quietly again.

2. Third session in a row where an error came from characterising a file instead of opening it.
L40 asserted that ch11 had already taught latent world models - Dreamer, TD-MPC, Ha and
Schmidhuber - and built three frames on it, including one billed as retroactively explaining all
of L39. ch11 contains none of them: grep returns zero hits for Dreamer, TD-MPC, MPC, CEM and
even 'world model', and its single model-based frame is titled 'What we just did was cheating'
because it hands you P(s'|s,a) rather than learning it. The callback was written from memory of
my own chapter plan. It is now honest new material with an explicit bridge from what ch11 does
teach. The same pass also caught a transition slide claiming students had 'built' CLIP when
ch12's own provenance block says NO MODEL IS TRAINED in that chapter.

3. Borrowed video stills need a settled-state check, and only a human-like reader catches it.
Two of the 34 stills were grabbed mid-animation: one showed a garbled half-rendered scribble
instead of the decoded prediction it was supposed to illustrate, another was clipped at the
frame edge. A third illustrated an anecdote about a robot moving an object to a picture of
Taylor Swift with a photograph containing no such picture. The compiler was happy, the clip
detector reported zero flags, and my own contact-sheet pass missed all three - a student review
reading the rendered pages found them in one pass. The skill's own guidance already warns to
grab a second or two AFTER the narration lands; I did not follow it. One still (the Euclidean
distance diagram) had to be dropped entirely: that animation pans horizontally, so it is clipped
at every timestamp.

4. Never batch-patch LaTeX with a script that interpolates backslashes. A Python patch applied
through a heredoc lost one level of escaping: \\textbf became a literal tab, and every
replacement whose search string contained \\begin silently failed to match. Two of six edits
landed, one corrupted a line, three did nothing - and str.replace() reports none of that. It was
caught only because an unrelated missing image broke the compile. Targeted Edit calls for LaTeX
from now on; if a bulk change is genuinely needed, verify by grepping for control characters
afterwards.

5. Refusing to draw a number is sometimes the honest figure. The chapter's counterweight figure
was specified as 'human vs model on the three physics benchmarks', but sources.md records that
Meta reports human performance as an 85-95% BAND with no per-benchmark figures, and model
performance only qualitatively as 'at or near chance'. Drawing three human bars would have made
the one chart intended to keep the chapter honest the only one built on invented numbers. It now
draws the band as a band, chance as a line, and prints the limitation on the figure itself.

Process note: the outline reviewer and both student reviewers were right on every checkable
claim this session, but each was verified against the source before being acted on. That habit
came from an earlier session where a reviewer's arithmetic was correct and 'fixing' it would
have introduced an error. The cost of checking is minutes; the cost of not checking is a wrong
number on a slide that outlives the lecture.
"""
