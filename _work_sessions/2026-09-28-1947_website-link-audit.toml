notes = """
Gotchas hit this session (candidates for _learnings/, not yet written):
- git ls-tree / ls-files without `-c core.quotepath=off` octal-escape non-ASCII paths, so every
  Armenian filename looked "missing" to my first checker (false positive on the Կարճ մաթեմ PDF).
- YouTube oEmbed 401 is "embedding disabled", not dead; the watch page's playabilityStatus is the
  reliable signal. A 200 after a redirect can still be a dead link (info.flagcounter.com -> homepage).
- Case-only rename on Windows: git mv A tmp && git mv tmp a. Two notebooks were lowercase on disk
  while git stored them capitalized.
- Writes on this machine intermittently failed with OSError Errno 22 (transient lock, likely
  Defender on a just-written file); a bounded retry went through. The failed open did not truncate.
- Low free RAM (1.2-2.4 GB) caused one MemoryError on a 9 MB JSON load and Git Bash fork errors.
- Quarto aliases for case-only renames collide on a Windows local render (same file); CI only.
- Shared docs with another session's uncommitted hunks were committed partially by writing
  HEAD + my edits straight into the index (git hash-object + update-index --cacheinfo).
