Instructor asked for a text-embedding project, then redirected the concept: words and short
phrases rather than documents, a dendrogram as the artifact, semantic structure discovered
rather than benchmarked, euclidean vs cosine compared, Armenian only, fourth project in ch09.

MODEL. Metric-AI/armenian-text-embeddings-2-large, already in the local HF cache. It is an
XLM-R finetune of multilingual-e5-large and cites arXiv 2603.22290 - which is paper 08 in
ml/text_embedding/papers/. The course's own reading list, the instructor's own model, and the
chapter's own practical close a loop. Needs the E5 'query: ' prefix; returns unit-norm vectors.

DATASET (py_src/armenian_words.py). 108 leaves, 12 semantic families, four probe kinds:
orthographic collision groups, phrase forms of 23 words, 6 synonym control pairs, and 4
polysemous surface forms (Արա / սեր / մարտ / բաց) as full sentences with anchors. The Արա
idea was the instructor's and is the best thing in the set: proper name, vocative particle,
verb imperative, one spelling.

THE FINDING. ձու (egg) and ձի (horse) are the CLOSEST PAIR IN THE ENTIRE SPACE at 0.505 -
closer than every planted synonym but one. Cause is not spelling but a shared subword token:
ձու/ձի/ձուկ/ձյուն all tokenize as ['▁ձ', ...], while ձեռք is a single token ['▁ձեռք'] and sits
at 1.399, 2.8x further, despite the same first letter. Six such words - 6% of the vocabulary -
cost 22% of the ARI (0.287 -> 0.350 when removed). Phrase forms recover about half.

Other measured results now in the notebook:
  - euclidean vs cosine: rank correlation 1.000000; single and complete give IDENTICAL
    partitions at every k tested; average's merge ORDER differs but the partitions coincide
    everywhere except k=16 (ARI 0.9877).
  - scipy refuses linkage(X, method='ward', metric='cosine') but runs silently on a
    precomputed cosine matrix. The guardrail exists and is trivially bypassed.
  - linkage matters far more than metric: ward 0.287, complete 0.251, average 0.126,
    single 0.001 (total chaining collapse).
  - polysemy 6/9, and every failure is the RARER sense losing to the dominant one, narrowly:
    lost by 0.005 / 0.057 / 0.084 while the dominant senses win by 0.27-0.33.

BUILT. py_src/armenian_words.py, py_src/embed_armenian_words.py -> data/armenian_words.npz
(563 KB, carries embeddings AND tokenizations so the tokenizer task needs no model),
34_semantic_tree_solution.ipynb (41 cells, executes clean in 19s, validates, 0 errors),
34_semantic_tree_OUTLINE.md, 10 tasks + bonus in 09_clustering.qmd, DECISIONS #27.
Notebook prose is bilingual - Armenian for the narrative beats, English for the mechanics.
"""

