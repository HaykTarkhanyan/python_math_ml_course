notes = """
VERIFY-BEFORE-DESIGN PAID FOR ITSELF THREE TIMES. Probing the model before writing any task
text caught three things that would each have shipped a false claim:

1. I designed a "normalization trap" bonus. It does not exist by this route - the model returns
   unit-norm vectors through sentence-transformers regardless of the flag (std 0.0000). Replaced
   with anisotropy/centering, which is a better bonus anyway.
2. I predicted "scipy refuses ward with cosine". Half right: it refuses when given vectors and
   complies silently when given a precomputed matrix. The silent version is the better lesson.
3. I claimed centering takes polysemy from 6/9 to 9/9. That 9/9 came from centering WITHIN each
   surface form's own 4-6 sentences - a mean estimated from almost nothing, and one that
   includes the very anchors being compared, so it flattered itself. On any honest sample it is
   6/9 or 7/9. Corrected in the doc with the reason, and the conclusion changed with it: the
   obstacle is dominant-sense bias, not anisotropy.

A BUG IN MY OWN DATASET, CAUGHT BY LOOKING AT THE PICTURE. The first draft had ձեռք as a
probe-only word with no semantic family. It drifted to its orthographic neighbours - but a word
with nowhere else to go proves nothing, so the central probe was uninterpretable. Every probe
word now belongs to a real family (two new families added: մարմին, բնություն), and in the
shipped tree ձեռք sits in the body-parts block while the other four ձ- words collide elsewhere.
That is the control working. RULE: a planted probe needs a home to be pulled AWAY from.

AN UNPLANNED FINDING WORTH EXTENDING. The shipped tree clusters հայր, մայր, մազ, քար, թառ, պար,
անտառ, ծառ, լեռ together - three families sharing the -ար/-այր/-առ ending. Shared SUFFIX tokens
collide too, not just prefixes. Nobody planted it; students will find it.

