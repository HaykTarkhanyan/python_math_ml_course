notes = """
Instructor slide references are by the PRINTED FOOTER frame number ('N / 36'), not the PDF page
number. The two diverge because \\pause overlays add PDF pages without incrementing the frame
counter. In deck 27, printed 11 = PDF page 12 and printed 25 = PDF page 26. Getting this wrong
sends you to the wrong slide.

Two defects this session were only findable by reading a deck front to back, not frame by frame:
the gamma collision in deck 28 (margin vs RBF bandwidth, each locally correct) and the ambiguous
'Scale?' column. Frame-level review cannot catch either.

The recurring weakness in deck 28 was assert-don't-show: 'scale first' appeared three times with
no demonstration while the HW frame asked students to demonstrate it, and gamma had a formula and
a code comment but no figure even though the HW asks them to sweep it. Worth watching for in the
next deck.

The measured gamma result is unusually good teaching material: gamma=60 gets 100% train and 88%
test, which is exactly the test score of the far-too-simple gamma=0.05 model. Perfect training
accuracy bought nothing, stated numerically rather than visually.

Tooling gotcha: the Grep tool under-reported on a rename sweep. It missed three live references in
ml/04_trees/ that a plain `grep -rn` found; neither file was gitignored and a repeat of the same
Grep call found them. For rename sweeps use `git grep` (tracked files, fast, authoritative) rather
than trusting a single pass.

Beamer clips overflow silently and pdflatex exits 0. Three frames were caught clipping only by
rendering pages to PNG and looking. On a two-column frame, added text belongs in whichever column
the figure is not filling - that fixed the kernel-trick frame without cutting anything.

The qmd pass was done with a script (scratchpad, not committed) so all 26 pages transform
identically. Two bugs were caught by reading the diff rather than the files: the first version ate
the blank line Quarto needs before the first heading, and an earlier version reflowed whole
documents and silently collapsed unrelated blank lines in three files. Final rule that worked:
normalise only the region being rebuilt, leave the rest byte-for-byte.

Not authored this session but committed as part of 'commit everything': the ch11_rl seven-deck
expansion plus its preamble \\usepackage{cancel}, the ml/agents staging-folder deletion, and the
26/27 _notes.pdf exports from today's lecture.
"""
