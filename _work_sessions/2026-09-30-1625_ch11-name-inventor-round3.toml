notes = """
Execution: 4 full runs this round. Run 1 exposed the live-demo ETA bug (clock started before
wandb.init, ~40 s) and a drawn probability printed as 0.00; run 2 was stopped a minute in because
a heredoc patch failed its assert and the unchained build + run went ahead on the old source (no
wandb run created); run 3 fixed the clock but epoch 1 still carried wandb's ~8 s first-log
overhead; run 4 measures the pace from epoch 2 and is the committed one (504 s of cell time on a
busy machine, 263 s on a quiet one).

Lesson from the stopped run: chain every build/execute step with && after a patch - a patch that
fails loudly is useless if the next command runs anyway.

Heredoc-embedded patch strings kept mismatching (quoting and escape handling between bash and
Python); file-based patches with raw ''' strings that print every match count before writing
worked first time. Docstrings inside replacement strings break r\"\"\" delimiters.

DECISIONS.md staging: #46 and #47 share an identical 'Date / Status' line in HEAD, so a plain
str.replace was ambiguous (assert caught it); replacing the line by position inside each entry
worked. The other session's uncommitted #45 stayed out of the commit.
"""
