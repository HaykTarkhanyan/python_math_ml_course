notes = """
Ran from about 09:30 (start time approximate) to about 15:50 on 2026-10-05. The instructor left
mid-afternoon with "for the stuff that's a no-brainer, go ahead and do it yourself immediately, no
need for our interviews"; everything else went into INTERVIEW_QUEUE.md. No commits after 8fbd261
(commits only on request), no subagents after the LLM-3 student review, no pushes.

Worth knowing:
- Measure before choosing what to show from a real model. GPT-2's "most focused" head turned out
  to be a perfect previous-token head, and 67% of all attention on the creature sentence lands on
  the first token (attention sinks) - a "concentrated vs spread" story would have been wrong.
- GPT-2 small does not know Elliott Smith or Ella Fitzgerald ("actress" 15.4%); Messi -> football
  35.1%, Mkhitaryan -> hockey 9.8%. "Henrikh Mkhitaryan" is 7 GPT-2 tokens, "Lionel Messi" 2.
- Two July 3b1b stills were grabbed at the wrong moment (fs_creature, fs_qkspace): look at every
  borrowed still before writing its caption.
- July figures were drawn at about twice their slot width (text 3.6-4.7 pt): detect_small_figure_text
  catches it; port and redraw at slot size rather than shrinking fonts.
- By-hand frames: assert the printed arithmetic, not only the exact one (0.11 + 0.11 = 0.22 but
  the slide says 0.21; print 3 decimals). Float rounding at .335 needed a 3-decimal comparison.
- The Bash heredoc backslash gotcha bit twice more (\\textwidth -> tab); both patches refused
  before writing. LaTeX edits go through the Edit tool.

Cost: one Sonnet student-review agent (~98k tokens, 89 s); four cached-GPT-2 runs (80 s, 60 s,
37 s, 25 s); one web fetch (GPT-2 paper), one Transformer Explainer check; no downloads, no paid API.
"""
