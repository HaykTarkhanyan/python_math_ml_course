notes = """
Ran from about 16:00 on 2026-10-05 to about 12:40 on 2026-10-06, with a pause overnight (the clock
jumped from 22:20 to 12:31 between two steps). The instructor stayed near the PC: "write session
log later (once done with current task) and continue doing some useful work". One question asked
(the e5 download, approved). Subagents only for the approved student review; no paid API, no
pushes; commits only on request.

Worth knowing:
- The recurring cause of small figure text in the older decks: figures drawn at matplotlib's
  default 6-9 in at 11 pt, then shrunk into a 2-4 in slot (scale 0.37-0.60, so 3-4.5 pt on the
  slide). Drawing at slot size makes the PDF show the size you typed.
- Text that fits a box at the old size usually will not at the new one: label widths do not
  shrink with the canvas. Widening the slot (frames had horizontal room, never vertical) and
  moving labels beat shrinking fonts every time.
- For axis-off diagrams in data coordinates, fig.subplots_adjust(left=0, right=1, ...) makes the
  data units span the canvas; otherwise boxes come out about 23% narrower than computed.
- A \\vspace at the very top of a frame does not reduce overflow; trimming gaps between blocks
  and saving one wrapped line does. A scripted pass that scales every gap of 0.3 em or more by
  0.45 in only the overflowing frames took L43 from 21 to 9 in one go; the rest needed a line.
- {\\small ...} around a beamer itemize made the recap worse (63 pt over instead of 16): the list
  spacing grew. Shortening two items fixed it.
- The L44 PDF stayed locked for a while (no pdflatex or viewer process found); compiling with
  -output-directory into the scratchpad kept the work going until it was writable again.

Cost: e5-small download 471 MB; about 35 short model-script runs (seconds each, CPU); four Sonnet
student-review agents, about 440k tokens together.
"""
