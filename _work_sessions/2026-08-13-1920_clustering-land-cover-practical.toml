notes = """
The measured results, all reproducible from the committed npz:

ARI vs WorldCover, k-means, by feature set and k (best in each row):
  RGB only                0.420 at k=4   - what the eye sees, worst at every k
  6 bands scaled          0.483 at k=5
  6 bands + NDVI + NDWI   0.559 at k=5, UNSCALED
  indices only            0.589 at k=4, UNSCALED - best in the whole sweep

Four design assumptions that the data killed, recorded in the outline's 'What the build found'
section because the wrong versions are the intuitive ones:

1. Scaling does not break the map. On six reflectance bands it moves ARI by +0.03; all six are
   the same unit, so nothing dominates unfairly. It only bites once NDVI/NDWI join, where it
   HURTS by up to 0.10, because unscaled those indices are 4-20x wider than the bands and
   dominating is the right thing for them to do. The lesson became 'scaling equalises influence,
   which only helps when the loud features were not the useful ones'.
2. ARI peaks at k=4 or 5 depending on feature set, not reliably at 5. k=4 is the honest number of
   findable classes, because grassland and cropland are not separable.
3. GMM ties k-means at k=5 (0.487 vs 0.483) and only wins at k=6 (0.545 vs 0.446).
4. The shoreline is not the uncertain region - it gets its own component. Uncertainty pools in
   Martuni and the field mosaic, and after the labels are revealed, in grassland and cropland,
   the exact pair the clustering cannot separate. This became a better act than the designed one:
   the GMM flags the weak distinction before any label is loaded. Built-up is the counterexample
   that keeps it honest - confidently assigned and wrong.

The strongest moment in the notebook was not designed at all. Plain accuracy against WorldCover
is exactly 0.000 (clusters numbered 0-4, classes numbered 10/30/40/50/80), which is the label
permutation problem in its most extreme possible form. And the closing act: ARI of 0.484 falls to
0.155 when the water is removed, recovering only to 0.186 on a land-only refit. Nearly the whole
headline score was one easy split worth 28% of the pixels.

Compute stayed well inside the laptop's limits: the whole notebook runs in 2m35s, nothing
parallel, k-means on the full million pixels takes about 10s, DBSCAN only ever touches a 20k
subsample and is presented as a failure rather than a result.

--- HSV section (image compression) ---

The circular-hue bug, measured on the Saryan painting at k=8. Take pixels with hue below 0.02 and
pixels with hue above 0.98 - all of them red - and ask how much their cluster distributions
overlap:

  RGB          93.5%
  HSV naive     0.1%     <- puts essentially NONE of them together
  HSV cone     97.3%

7.86% of the painting is saturated pixels sitting within 0.04 of the seam, so this is not a corner
case on this image. A second trap: 5.38% of pixels are near-grey, where hue is numerical noise;
the cone encoding handles that for free because it scales hue by saturation.

The honest conclusion is two-sided, which makes it better teaching than "use HSV":

  space        RGB MSE    hue coherence
  RGB          0.00673    0.898
  HSV naive    0.01118    0.866
  HSV cone     0.01060    0.918

Cluster in RGB if you want the image back (k-means minimises squared distance in whatever space
you hand it, and MSE is measured in RGB). Cluster in cone-HSV if you want a hue-coherent palette.
Naive HSV loses at both, which is remarkable for a colour space built around hue.

--- CLIP photo grouping ---

The number the whole chapter turns on. Same k-means, same k=10, same 2000 photos:

  raw pixels (6912 dims)     ARI 0.048
  colour histogram (64 dims) ARI 0.042
  CLIP embedding (512 dims)  ARI 0.939

Zero-shot cluster naming got 10 of 10 right over a 40-word vocabulary, with no labels. The
runner-up words are the interesting output because they describe the geometry: church -> clock
(towers have clock faces), golf ball -> parachute (white domes on open backgrounds), tench ->
boat, chain saw -> tractor, French horn -> violin.

Two findings worth keeping:

- The silhouette picked the right k here (10) after picking the wrong one at Sevan (2), and its
  absolute value was LOWER on the far better partition: 0.19 versus 0.68. In 512 dimensions
  everything is far from everything, so absolute silhouette values are not comparable between
  problems. Shape across k is informative; height is not.
- One cluster always becomes a junk drawer. The chain-saw cluster absorbed 39 strays from nearly
  every other class, because k-means cannot decline to assign a point. Same limitation the Sevan
  practical hit from the DBSCAN side.

L2 normalisation of the embeddings barely mattered (ARI 0.938 vs 0.939) because CLIP norms are
already nearly constant (10.53 +/- 0.54). Still the right default, but on this data a formality -
the third instance today of "measure, do not assume" landing on the unglamorous answer.

Tooling gotcha: plotly escapes forward slashes as \\u002f in its serialized JSON, so grepping the
generated HTML for 'data:image/jpeg;base64' returns zero hits even when every thumbnail is present
and works. Verify interactive output by driving a real browser, not by string-matching the file.
Also, with plotly 6 the arrays on gd.data are the raw (possibly base64-packed) form; the expanded
values live on gd._fullData, which matters when computing point pixel positions in a test.
