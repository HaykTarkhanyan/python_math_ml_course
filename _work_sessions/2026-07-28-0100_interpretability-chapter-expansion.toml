  the teaching point. Baseline test MAE 455.1; yr is 766/671/653 across PFI/CFI/LOCO.
- M-plot spans ~4215 rentals vs PDP ~1906 vs ALE ~1608 on temp. The M-plot's extra steepness is
  atemp/season/mnth being charged to temp - that IS the confounding.
- Bootstrap credit-splitting: full-data temp +371 / atemp +582 (sum +953); bootstrap sd 593 / 605
  but SUM sd only 43 (14x steadier); temp goes NEGATIVE in 32% of resamples; drop atemp and temp
  jumps to +943, i.e. the pair's whole effect.
- Overall interaction H_j on bike: temp 0.21, yr 0.18, hum 0.16 ... weathersit 0.04.

UCI BIKE NORMALISATION (verified, sanity-checked against DC weather):
temp = (T+8)/47, atemp = (T+16)/66, hum = h/100, windspeed = w/67. So the deck's recurring
temp<=0.43 split means ~12.2 C; mean 0.495 = 15.3 C, min = -5.2 C, max = 32.5 C. day.csv's
weathersit only ever takes values 1-3 (category 4, heavy rain, never occurs as a daily average).

LIBRARY TRAP: the H-statistic package is `pip install pyartemis` but `import artemis`. Plain
`artemis` on PyPI is an unrelated API client - the deck previously sent students there. All library
names verified live on PyPI: interpret 0.7.8, alibi 0.9.6, PyALE 1.2.0, dalex 1.8.0, effector 0.5.0,
shap 0.52.0, pyartemis 0.1.5, sage-importance 0.0.6, fippy 0.2.0.

imodels' RuleFitRegressor barely sparsifies - it keeps ~all candidate rules at every max_rules
