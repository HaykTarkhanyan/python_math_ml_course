<!doctype html>
<!-- LLM-block announcement poster. One template, four layouts: open with ?s=portrait|square|landscape|story.
     render.sh screenshots each size with headless Edge. roadmap_pass.png is ml/14_llms/fig/roadmap_overview_pass.pdf at 400 dpi. -->
<html lang="hy"><head><meta charset="utf-8"><title>LLM poster</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@900&family=JetBrains+Mono:wght@700;800&display=block">
<script>document.documentElement.className = 's-' + (new URLSearchParams(location.search).get('s') || 'portrait');</script>
<style>
  :root { --navy: #003048; --red: #E63946; }
  .s-portrait  { --w: 1080px; --h: 1350px; }
  .s-square    { --w: 1080px; --h: 1080px; }
  .s-landscape { --w: 1200px; --h: 627px; }
  .s-story     { --w: 1080px; --h: 1920px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body { background: var(--navy); color: #fff; -webkit-font-smoothing: antialiased; }

  .poster { position: relative; width: var(--w); height: var(--h); }
  .logo { display: block; height: 42px; }
  .path { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 34px; }
  .path span { opacity: .45; }
  .path b { color: var(--red); }
  h1 { margin-top: 30px; font-family: 'Noto Sans Armenian', sans-serif; font-weight: 900; font-size: 100px; line-height: 1.05; }
  h1 em { font-style: normal; color: var(--red); }
  .card { background: #fff; border-radius: 22px; padding: 22px 18px; }
  .fig { display: block; width: 100%; }
  .link { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 34px; }

  /* vertical layouts: logo pinned top, link pinned bottom, title + card centred */
  .s-portrait .poster, .s-square .poster, .s-story .poster {
    display: flex; flex-direction: column; justify-content: center; padding: 0 72px; }
  .s-portrait .text, .s-square .text, .s-story .text { display: contents; }
  .s-portrait .logo, .s-square .logo, .s-story .logo { position: absolute; top: 64px; left: 72px; }
  .s-portrait .link, .s-square .link, .s-story .link { position: absolute; bottom: 64px; left: 72px; }
  .s-portrait .card, .s-square .card, .s-story .card { margin-top: 56px; }

  /* square: title on one line so the figure keeps its size */
  .s-square h1 { font-size: 88px; }
  .s-square h1 br { display: none; }
  .s-square .card { margin-top: 44px; }

  /* story: keep the top and bottom ~250 px clear of the platform's overlays */
  .s-story .logo { top: 270px; }
  .s-story .link { bottom: 270px; }
  .s-story h1 { font-size: 120px; }
  .s-story .path { font-size: 38px; }

  /* landscape: text column left, figure right */
  .s-landscape .poster { display: grid; grid-template-columns: 410px 1fr; gap: 28px; align-items: center; padding: 44px 48px; }
  .s-landscape .text { height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; }
  .s-landscape .logo { height: 32px; }
  .s-landscape .path { font-size: 22px; }
  .s-landscape h1 { margin-top: 16px; font-size: 76px; }
  .s-landscape .link { font-size: 24px; }
  .s-landscape .card { border-radius: 16px; padding: 14px 10px; }
</style></head>
<body><div class="poster">
  <div class="text">
    <img class="logo" src="../../../assets/metric.svg">
    <div class="mid">
      <div class="path"><span>ML → NN → CNN → RNN →</span> <b>LLM</b></div>
      <h1>LLM-ները՝ <br><em>ներսից</em></h1>
    </div>
    <div class="link">t.me/metric_academy</div>
  </div>
  <div class="card"><img class="fig" src="roadmap_pass.png"></div>
</div></body></html>
